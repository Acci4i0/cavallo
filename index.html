<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>&nbsp;</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <!-- Nessun elemento di interfaccia: la griglia è generata interamente dalla
       matrice in src/data/mask-frames.json. -->
  <main id="stage"><div id="grid"></div></main>

  <!-- Visore a schermo intero. Si apre solo a galoppo fermo, cioe sotto zoom:
       con le celle in movimento il bersaglio cambierebbe fra il tocco e il
       rilascio, ed e esattamente il difetto della versione precedente. -->
  <div id="viewer" hidden>
    <img id="viewerImg" alt="">
    <button id="prev" type="button" aria-label="Precedente">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <path d="M16.5 4 7.5 13l9 9" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
    <button id="next" type="button" aria-label="Successiva">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <path d="M9.5 4l9 9-9 9" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
