# Pubblica la root su GitHub Pages a ogni push su main.
# Il progetto è statico (nessun build step): si carica l'albero così com'è.
#
# Pages è già impostato su build_type "workflow" lato repository. Non si usa
# `enablement: true` su configure-pages: con i permessi di default di Actions
# a "read" quel passo fallisce, perché il GITHUB_TOKEN non può creare Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
